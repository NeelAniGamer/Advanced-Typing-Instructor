<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Advanced Typing Instructor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d0d1a; color: #fff; padding: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #00e5ff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b3cc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add a Quest</h2>
        <form id="questForm">
            <label>Quest Title:</label>
            <input type="text" id="qTitle" placeholder="e.g. Speed Demon" required>
            
            <label>Quest Description:</label>
            <input type="text" id="qTarget" placeholder="e.g. Reach 120 WPM in any mode" required>
            
            <label>Category:</label>
            <select id="qCategory">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
            
            <label>Reward (Rupees):</label>
            <input type="number" id="qReward" value="500" required>
            
            <button type="submit">Add Quest</button>
        </form>
    </div>
    <script>
        document.getElementById('questForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('qTitle').value,
                desc: document.getElementById('qTarget').value,
                category: document.getElementById('qCategory').value,
                reward: parseInt(document.getElementById('qReward').value),
                completed: false,
                progress: 0,
                maxProgress: 1 // simplify for now
            };
            try {
                const res = await fetch('/api/admin/add_quest', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('Quest added!');
                    e.target.reset();
                } else {
                    alert('Failed to add quest.');
                }
            } catch(e) { alert('Error: ' + e); }
        });
    </script>
</body>
</html>
