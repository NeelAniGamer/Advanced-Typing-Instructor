<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f5f0e8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook-burst"
        class="scene"
        data-composition-id="01-hook-burst"
        data-composition-src="compositions/frames/01-hook-burst.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-tension"
        class="scene"
        data-composition-id="02-tension"
        data-composition-src="compositions/frames/02-tension.html"
        data-start="2"
        data-duration="2.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-reveal"
        class="scene"
        data-composition-id="03-reveal"
        data-composition-src="compositions/frames/03-reveal.html"
        data-start="4"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-speed-counter"
        class="scene"
        data-composition-id="04-speed-counter"
        data-composition-src="compositions/frames/04-speed-counter.html"
        data-start="7"
        data-duration="2.9"
        data-track-index="1"
      ></div>

      <div
        id="el-05-feature-cascade"
        class="scene"
        data-composition-id="05-feature-cascade"
        data-composition-src="compositions/frames/05-feature-cascade.html"
        data-start="9.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-sound-synthesizer"
        class="scene"
        data-composition-id="06-sound-synthesizer"
        data-composition-src="compositions/frames/06-sound-synthesizer.html"
        data-start="12.5"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-07-multiplayer"
        class="scene"
        data-composition-id="07-multiplayer"
        data-composition-src="compositions/frames/07-multiplayer.html"
        data-start="15"
        data-duration="3.6"
        data-track-index="0"
      ></div>

      <div
        id="el-08-heatmap"
        class="scene"
        data-composition-id="08-heatmap"
        data-composition-src="compositions/frames/08-heatmap.html"
        data-start="18"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-09-achievements"
        class="scene"
        data-composition-id="09-achievements"
        data-composition-src="compositions/frames/09-achievements.html"
        data-start="20.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-10-authority"
        class="scene"
        data-composition-id="10-authority"
        data-composition-src="compositions/frames/10-authority.html"
        data-start="23.5"
        data-duration="2.9"
        data-track-index="1"
      ></div>

      <div
        id="el-11-cta"
        class="scene"
        data-composition-id="11-cta"
        data-composition-src="compositions/frames/11-cta.html"
        data-start="26"
        data-duration="3"
        data-track-index="0"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/funk_groove.mp3"
        data-start="0"
        data-duration="29"
        data-track-index="11"
        data-volume="0.4"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook-burst", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2);
        tl.fromTo("#el-02-tension", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 2);
        tl.to("#el-02-tension", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4);
        tl.fromTo("#el-03-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4);
        tl.to("#el-03-reveal", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.fromTo("#el-04-speed-counter", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.to("#el-04-speed-counter", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 9.5);
        tl.fromTo("#el-05-feature-cascade", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 9.5);
        tl.to("#el-05-feature-cascade", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12.5);
        tl.fromTo("#el-06-sound-synthesizer", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.5);
        tl.to("#el-06-sound-synthesizer", { x: 1080, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.fromTo("#el-07-multiplayer", { x: -1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 15);
        tl.to("#el-07-multiplayer", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-08-heatmap", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.to("#el-08-heatmap", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 20.5);
        tl.fromTo("#el-09-achievements", { y: 1920, opacity: 1 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 20.5);
        tl.to("#el-09-achievements", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23.5);
        tl.fromTo("#el-10-authority", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23.5);
        tl.to("#el-10-authority", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 26);
        tl.fromTo("#el-11-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 26);
        tl.to({}, { duration: 29 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
