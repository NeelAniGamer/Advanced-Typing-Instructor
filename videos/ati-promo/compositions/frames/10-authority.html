<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: #1a1a2e;
      }
      .content-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 100px 80px;
        text-align: center;
        z-index: 10;
      }
      .col-badge {
        width: 140px;
        height: 140px;
        border-radius: 36px;
        background: rgba(255, 190, 11, 0.15);
        border: 4px solid #FFBE0B;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        box-shadow: 0 0 50px rgba(255, 190, 11, 0.35);
        margin-bottom: 40px;
      }
      .sub-head {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 6px;
        color: #FF5E5B;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .main-title {
        font-size: 88px;
        font-weight: 900;
        color: #f5f0e8;
        line-height: 1.0;
        letter-spacing: -2px;
        text-transform: uppercase;
        margin-bottom: 60px;
      }
      .team-grid {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        max-width: 820px;
      }
      .dev-card {
        padding: 32px 40px;
        background: #252542;
        border: 2px solid #6c5b7b;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      }
      .dev-name {
        font-size: 36px;
        font-weight: 900;
        color: #f5f0e8;
        letter-spacing: 1px;
      }
      .dev-role {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #FFBE0B;
        text-transform: uppercase;
      }
      .footer-note {
        margin-top: 60px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #00B4D8;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="10-authority"
      data-start="0"
      data-duration="2.9"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-10" class="clip bg-layer" data-start="0" data-duration="2.9" data-track-index="0"></div>

      <div id="content-10" class="clip content-center" data-start="0" data-duration="2.9" data-track-index="1" data-layout-allow-overlap="true">
        <div id="crest" class="col-badge">🎓</div>
        <div id="sub" class="sub-head">ENGINEERED WITH PASSION BY</div>
        <div id="title" class="main-title">NEEL, ANSH<br>& AARUSH</div>

        <div class="team-grid">
          <div id="dev1" class="dev-card" style="border-color: #FF5E5B;">
            <span class="dev-name">NEEL</span>
            <span class="dev-role" style="color: #FF5E5B;">LEAD ARCHITECT</span>
          </div>
          <div id="dev2" class="dev-card" style="border-color: #FFBE0B;">
            <span class="dev-name">ANSH</span>
            <span class="dev-role">CORE ENGINE & AUDIO</span>
          </div>
          <div id="dev3" class="dev-card" style="border-color: #00B4D8;">
            <span class="dev-name">AARUSH</span>
            <span class="dev-role" style="color: #00B4D8;">GAMEPLAY & NETWORKING</span>
          </div>
        </div>

        <div id="loc" class="footer-note">CLASS OF LEARNERS · MUMBAI</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#crest",
        { scale: 0.2, opacity: 0, rotation: -45 },
        { scale: 1.0, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" },
        0.05
      );

      tl.fromTo("#sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.2
      );
      tl.fromTo("#title",
        { opacity: 0, scale: 0.9, y: 30 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "back.out(1.4)" },
        0.3
      );

      tl.fromTo(["#dev1", "#dev2", "#dev3"],
        { opacity: 0, x: -50 },
        { opacity: 1, x: 0, stagger: 0.15, duration: 0.5, ease: "power2.out" },
        0.5
      );

      tl.fromTo("#loc",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.9
      );

      window.__timelines["10-authority"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
