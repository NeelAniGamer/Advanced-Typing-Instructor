<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: #1a1a2e;
      }
      .speed-glow {
        position: absolute;
        top: 20%;
        left: 50%;
        width: 800px;
        height: 600px;
        margin-left: -400px;
        background: radial-gradient(ellipse, rgba(255, 94, 91, 0.25) 0%, transparent 70%);
      }
      .telemetry-stage {
        position: absolute;
        top: 130px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 20;
      }
      .telemetry-label {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 8px;
        color: #FFBE0B;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .counter-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 16px;
        margin-bottom: 24px;
      }
      .counter-num {
        font-size: 220px;
        font-weight: 900;
        line-height: 1;
        color: #FF5E5B;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 10px 60px rgba(255, 94, 91, 0.5);
      }
      .counter-unit {
        font-size: 56px;
        font-weight: 900;
        color: #f5f0e8;
        letter-spacing: 2px;
      }
      .accuracy-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 32px;
        background: rgba(0, 180, 216, 0.15);
        border: 2px solid #00B4D8;
        border-radius: 100px;
        font-size: 26px;
        font-weight: 800;
        color: #00B4D8;
        letter-spacing: 2px;
      }
      .arena-card {
        position: absolute;
        bottom: 90px;
        left: 60px;
        right: 60px;
        height: 1020px;
        border-radius: 28px;
        overflow: hidden;
        border: 4px solid #FFBE0B;
        box-shadow: 0 30px 90px rgba(0,0,0,0.85);
        z-index: 10;
        background: #0f101a;
      }
      .arena-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="04-speed-counter"
      data-start="0"
      data-duration="2.9"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-04" class="clip bg-layer" data-start="0" data-duration="2.9" data-track-index="0">
        <div class="speed-glow"></div>
      </div>

      <div id="telemetry-04" class="clip telemetry-stage" data-start="0" data-duration="2.9" data-track-index="1" data-layout-allow-overlap="true">
        <div id="label" class="telemetry-label" data-layout-allow-overlap="true">REAL-TIME VELOCITY</div>
        <div class="counter-row" data-layout-allow-overlap="true">
          <div id="counter" class="counter-num" data-layout-allow-overlap="true">0</div>
          <div class="counter-unit">WPM</div>
        </div>
        <div id="acc" class="accuracy-pill" data-layout-allow-overlap="true">✓ 99.4% RAW ACCURACY</div>
      </div>

      <div id="arena" class="clip arena-card" data-start="0" data-duration="2.9" data-track-index="2">
        <img class="arena-img" src="assets/ati-typing-arena.png" alt="ATI Typing Arena" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#label",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.05
      );

      // WPM Counter animation 0 -> 142
      const counterEl = document.getElementById("counter");
      const countObj = { val: 0 };

      tl.to(countObj, {
        val: 142,
        duration: 1.4,
        ease: "power2.out",
        onUpdate: () => {
          counterEl.innerText = Math.floor(countObj.val);
        }
      }, 0.1);

      tl.fromTo("#counter",
        { scale: 0.6, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.5)" },
        0.1
      );

      tl.fromTo("#acc",
        { opacity: 0, scale: 0.8, y: 20 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.6)" },
        0.9
      );

      tl.fromTo("#arena",
        { opacity: 0, y: 100, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1.0, duration: 0.8, ease: "power3.out" },
        0.4
      );

      window.__timelines["04-speed-counter"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
