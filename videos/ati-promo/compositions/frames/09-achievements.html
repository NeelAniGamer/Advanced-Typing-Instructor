<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: #1a1a2e;
      }
      .header-wrap {
        position: absolute;
        top: 130px;
        left: 80px;
        right: 80px;
        text-align: center;
        z-index: 20;
      }
      .rank-pill {
        display: inline-block;
        padding: 10px 24px;
        background: rgba(255, 190, 11, 0.15);
        border: 2px solid #FFBE0B;
        border-radius: 100px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #FFBE0B;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .headline {
        font-size: 80px;
        font-weight: 900;
        color: #f5f0e8;
        line-height: 0.95;
        letter-spacing: -2px;
        text-transform: uppercase;
      }
      .rank-stepper {
        position: absolute;
        top: 360px;
        left: 80px;
        right: 80px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #252542;
        border: 3px solid #6c5b7b;
        border-radius: 20px;
        padding: 24px 32px;
        z-index: 15;
      }
      .rank-item {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #c4bdd4;
      }
      .rank-arrow {
        color: #FFBE0B;
        font-size: 24px;
      }
      .rank-active {
        color: #FF5E5B;
        text-shadow: 0 0 20px rgba(255, 94, 91, 0.6);
      }
      .achieve-card {
        position: absolute;
        bottom: 90px;
        left: 60px;
        right: 60px;
        height: 1000px;
        border-radius: 28px;
        overflow: hidden;
        border: 4px solid #FF5E5B;
        box-shadow: 0 30px 90px rgba(0,0,0,0.85), 0 0 50px rgba(255, 94, 91, 0.25);
        z-index: 10;
        background: #0f101a;
      }
      .achieve-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="09-achievements"
      data-start="0"
      data-duration="3.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-09" class="clip bg-layer" data-start="0" data-duration="3.5" data-track-index="0"></div>

      <div id="header-09" class="clip header-wrap" data-start="0" data-duration="3.5" data-track-index="1">
        <div id="badge" class="rank-pill">👑 CAREER PROGRESSION</div>
        <div id="title" class="headline">BECOME A<br><span style="color: #FF5E5B;">SPEED LEGEND.</span></div>
      </div>

      <div id="stepper" class="clip rank-stepper" data-start="0" data-duration="3.5" data-track-index="2">
        <span class="rank-item">ROOKIE</span>
        <span class="rank-arrow">→</span>
        <span class="rank-item" style="color: #FFBE0B;">ADEPT</span>
        <span class="rank-arrow">→</span>
        <span class="rank-item rank-active">LEGEND ⚡</span>
      </div>

      <div id="card" class="clip achieve-card" data-start="0" data-duration="3.5" data-track-index="3">
        <img class="achieve-img" src="assets/ati-achievements.png" alt="ATI Achievements" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#badge",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.05
      );
      tl.fromTo("#title",
        { opacity: 0, scale: 0.9, y: 30 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "back.out(1.5)" },
        0.15
      );

      tl.fromTo("#stepper",
        { opacity: 0, y: -30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.3
      );

      tl.fromTo("#card",
        { opacity: 0, y: 90, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1.0, duration: 0.8, ease: "power3.out" },
        0.45
      );

      window.__timelines["09-achievements"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
