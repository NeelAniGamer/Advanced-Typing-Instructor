<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        perspective: 1200px;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: #1a1a2e;
      }
      .bg-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 65%;
        background: linear-gradient(180deg, rgba(255, 94, 91, 0.08) 0%, transparent 100%);
      }
      .header-block {
        position: absolute;
        top: 140px;
        left: 80px;
        right: 80px;
        text-align: center;
        z-index: 20;
      }
      .category-pill {
        display: inline-block;
        padding: 10px 24px;
        background: #FF5E5B;
        color: #1a1a2e;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 4px;
        text-transform: uppercase;
        border-radius: 8px;
        margin-bottom: 24px;
      }
      .main-title {
        font-size: 80px;
        font-weight: 900;
        color: #f5f0e8;
        line-height: 0.95;
        letter-spacing: -2px;
        text-transform: uppercase;
      }
      .version-tag {
        color: #FFBE0B;
        font-size: 40px;
        margin-left: 12px;
      }
      .sub-title {
        margin-top: 20px;
        font-size: 28px;
        color: #f5f0e8;
        opacity: 0.8;
        letter-spacing: 2px;
      }
      .mockup-container {
        position: absolute;
        bottom: 120px;
        left: 60px;
        right: 60px;
        height: 1100px;
        border-radius: 28px;
        overflow: hidden;
        border: 4px solid #FF5E5B;
        box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 60px rgba(255, 94, 91, 0.3);
        transform-style: preserve-3d;
        z-index: 10;
        background: #0f101a;
      }
      .mockup-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        display: block;
      }
      .accent-stripe {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
        z-index: 30;
      }
      .stat-chip {
        padding: 14px 28px;
        background: rgba(26, 26, 46, 0.9);
        border: 2px solid #FFBE0B;
        border-radius: 100px;
        color: #f5f0e8;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="03-reveal"
      data-start="0"
      data-duration="3.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-03" class="clip bg-layer" data-start="0" data-duration="3.5" data-track-index="0">
        <div class="bg-panel"></div>
      </div>

      <div id="header-03" class="clip header-block" data-start="0" data-duration="3.5" data-track-index="1">
        <div id="pill" class="category-pill">Official Release</div>
        <div id="title" class="main-title">ATI<span class="version-tag">v2.5</span></div>
        <div id="sub" class="sub-title">Advanced Typing Instructor</div>
      </div>

      <div id="mockup" class="clip mockup-container" data-start="0" data-duration="3.5" data-track-index="2">
        <img class="mockup-img" src="assets/ati-landing.png" alt="ATI Landing Screen" />
      </div>

      <div id="chips" class="clip accent-stripe" data-start="0" data-duration="3.5" data-track-index="3">
        <div class="stat-chip">⚡ Native Desktop</div>
        <div class="stat-chip" style="border-color: #FF5E5B;">🎮 Gamified Arena</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#pill",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.05
      );
      tl.fromTo("#title",
        { opacity: 0, scale: 0.85, y: 30 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.6, ease: "back.out(1.5)" },
        0.15
      );
      tl.fromTo("#sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.3
      );

      // 3D perspective fly-in of the real app interface
      tl.fromTo("#mockup",
        { opacity: 0, scale: 0.8, rotateX: 20, y: 120 },
        { opacity: 1, scale: 1.0, rotateX: 0, y: 0, duration: 0.9, ease: "power3.out" },
        0.35
      );

      tl.fromTo("#chips",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.7
      );

      window.__timelines["03-reveal"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
