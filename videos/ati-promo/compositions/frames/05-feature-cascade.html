<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: #1a1a2e;
      }
      .header-wrap {
        position: absolute;
        top: 140px;
        left: 80px;
        right: 80px;
        z-index: 20;
      }
      .pill-badge {
        display: inline-block;
        font-size: 20px;
        font-weight: 800;
        color: #FF5E5B;
        letter-spacing: 5px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .headline {
        font-size: 84px;
        font-weight: 900;
        color: #f5f0e8;
        line-height: 0.95;
        letter-spacing: -2px;
        text-transform: uppercase;
      }
      .cards-stack {
        position: absolute;
        top: 440px;
        left: 80px;
        right: 80px;
        display: flex;
        flex-direction: column;
        gap: 36px;
        z-index: 10;
      }
      .feature-card {
        background: #252542;
        border-radius: 24px;
        padding: 44px 48px;
        border: 3px solid #6c5b7b;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        gap: 36px;
        will-change: transform, opacity;
      }
      .card-icon {
        width: 100px;
        height: 100px;
        border-radius: 20px;
        background: rgba(255, 94, 91, 0.15);
        border: 2px solid #FF5E5B;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        flex-shrink: 0;
      }
      .card-text {
        flex: 1;
      }
      .card-title {
        font-size: 40px;
        font-weight: 900;
        color: #f5f0e8;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .card-desc {
        font-size: 24px;
        color: #f5f0e8;
        opacity: 0.75;
        line-height: 1.3;
      }
      .card-1 { border-color: #FF5E5B; }
      .card-2 { border-color: #FFBE0B; }
      .card-2 .card-icon { background: rgba(255, 190, 11, 0.15); border-color: #FFBE0B; }
      .card-3 { border-color: #00B4D8; }
      .card-3 .card-icon { background: rgba(0, 180, 216, 0.15); border-color: #00B4D8; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="05-feature-cascade"
      data-start="0"
      data-duration="3.5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-05" class="clip bg-layer" data-start="0" data-duration="3.5" data-track-index="0"></div>

      <div id="header-05" class="clip header-wrap" data-start="0" data-duration="3.5" data-track-index="1">
        <div id="badge" class="pill-badge">GAME SYSTEM ARCHITECTURE</div>
        <div id="title" class="headline">NOT A DRILL.<br><span style="color: #FFBE0B;">A REAL GAME.</span></div>
      </div>

      <div class="cards-stack">
        <div id="card1" class="clip feature-card card-1" data-start="0" data-duration="3.5" data-track-index="2">
          <div class="card-icon">🗺️</div>
          <div class="card-text">
            <div class="card-title">200+ LEVELS</div>
            <div class="card-desc">Comprehensive curriculum from basics to complex coding syntax.</div>
          </div>
        </div>

        <div id="card2" class="clip feature-card card-2" data-start="0" data-duration="3.5" data-track-index="3">
          <div class="card-icon">👾</div>
          <div class="card-text">
            <div class="card-title">AI BOSS BATTLES</div>
            <div class="card-desc">Milestone boss encounters with adaptive pacing and speed gates.</div>
          </div>
        </div>

        <div id="card3" class="clip feature-card card-3" data-start="0" data-duration="3.5" data-track-index="4">
          <div class="card-icon">🏆</div>
          <div class="card-text">
            <div class="card-title">TOURNAMENT BRACKETS</div>
            <div class="card-desc">Compete in ranked weekly ladders and claim prestigious trophies.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#badge",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.05
      );
      tl.fromTo("#title",
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.15
      );

      // Staggered card slam with bounce
      tl.fromTo("#card1",
        { opacity: 0, x: 500, scale: 0.9 },
        { opacity: 1, x: 0, scale: 1.0, duration: 0.6, ease: "back.out(1.2)" },
        0.35
      );
      tl.fromTo("#card2",
        { opacity: 0, x: 500, scale: 0.9 },
        { opacity: 1, x: 0, scale: 1.0, duration: 0.6, ease: "back.out(1.2)" },
        0.6
      );
      tl.fromTo("#card3",
        { opacity: 0, x: 500, scale: 0.9 },
        { opacity: 1, x: 0, scale: 1.0, duration: 0.6, ease: "back.out(1.2)" },
        0.85
      );

      window.__timelines["05-feature-cascade"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
