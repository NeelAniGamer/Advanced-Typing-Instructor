<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, #2d1d38 0%, #1a1a2e 75%, #0e0e1a 100%);
      }
      .content-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 100px 80px;
        text-align: center;
        z-index: 10;
      }
      .logo-mark {
        width: 180px;
        height: 180px;
        border-radius: 44px;
        background: linear-gradient(135deg, #FF5E5B, #FFBE0B);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 88px;
        font-weight: 900;
        color: #1a1a2e;
        box-shadow: 0 20px 60px rgba(255, 94, 91, 0.5);
        margin-bottom: 40px;
      }
      .cta-headline {
        font-size: 96px;
        font-weight: 900;
        color: #f5f0e8;
        line-height: 0.95;
        letter-spacing: -3px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .cta-sub {
        font-size: 32px;
        color: #f5f0e8;
        opacity: 0.85;
        letter-spacing: 2px;
        margin-bottom: 60px;
      }
      .dl-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: 100%;
        max-width: 820px;
        padding: 44px 50px;
        background: #FF5E5B;
        border: none;
        border-radius: 28px;
        color: #1a1a2e;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        box-shadow: 0 25px 70px rgba(255, 94, 91, 0.6);
        will-change: transform;
      }
      .url-box {
        margin-top: 50px;
        padding: 20px 40px;
        background: rgba(37, 37, 66, 0.8);
        border: 2px solid #FFBE0B;
        border-radius: 100px;
        font-size: 30px;
        font-weight: 800;
        color: #FFBE0B;
        letter-spacing: 2px;
      }
      .footer-badge {
        margin-top: 50px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #8A9490;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="11-cta"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg-11" class="clip bg-layer" data-start="0" data-duration="3" data-track-index="0"></div>

      <div id="content-11" class="clip content-center" data-start="0" data-duration="3" data-track-index="1" data-layout-allow-overlap="true">
        <div id="logo" class="logo-mark">⌨️</div>
        <div id="title" class="cta-headline">TYPE FASTER.<br><span style="color: #FFBE0B;">PLAY TODAY.</span></div>
        <div id="sub" class="cta-sub">Free native app for Windows 10 & 11</div>

        <div id="btn" class="dl-button">
          <span>⚡ DOWNLOAD FREE</span>
        </div>

        <div id="url" class="url-box">advancedlogiclabs.dpdns.org</div>
        <div id="os" class="footer-badge">NO CREDIT CARD · NO SIGNUP REQUIRED</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#logo",
        { scale: 0.2, opacity: 0, rotation: -20 },
        { scale: 1.0, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" },
        0.05
      );

      tl.fromTo("#title",
        { opacity: 0, scale: 0.85, y: 30 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.6, ease: "back.out(1.5)" },
        0.2
      );

      tl.fromTo("#sub",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.35
      );

      tl.fromTo("#btn",
        { scale: 0.7, opacity: 0, y: 40 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.6, ease: "elastic.out(1, 0.6)" },
        0.5
      );

      // Subtle pulsing call-to-action on the button
      tl.fromTo("#btn",
        { scale: 1.0 },
        { scale: 1.04, repeat: 4, yoyo: true, duration: 0.35, ease: "sine.inOut", immediateRender: false },
        1.1
      );

      tl.fromTo("#url",
        { opacity: 0, scale: 0.9, y: 20 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "power2.out" },
        0.75
      );

      tl.fromTo("#os",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.95
      );

      window.__timelines["11-cta"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
